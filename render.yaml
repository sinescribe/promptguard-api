services:
  - type: web
    name: promptguard-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn promptguard_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PROMPTGUARD_GUMROAD_PERMALINK
        value: qzubcy
      - key: PROMPTGUARD_FREE_RPM
        value: "60"
